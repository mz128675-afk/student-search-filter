<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Search + Filter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-3">Student Search + Filter</h1>
    <p class="text-muted">Type a name below — the cards update as you type. Search uses filter(), cards are built with map().</p>
    <input type="text" id="searchInput" class="form-control mb-4" placeholder="Search by name...">
    <div id="cardsRow" class="row g-3"></div>
    <p id="noResult" class="text-muted mt-3 d-none">No student found with that name.</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
